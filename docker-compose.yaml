      - ./_TESTER_APPEND_SYSTEM.md:/root/.pi/agent/APPEND_SYSTEM.md:ro
      - ./workspace:/workspace
      - ./state/tester/session-history:/root/.pi/agent/session-history
      - ./state/tester/sessions:/root/.pi/agent/sessions
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
