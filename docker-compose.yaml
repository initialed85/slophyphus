      - PI_TEAM_ROOM_SHARED_SECRET='slopyphus'
      - PI_TEAM_ROOM_PEERS='coordinator:43321'

  nginx:
    depends_on:
      build:
        condition: service_completed_successfully
      coordinator:
        condition: service_started
      coder-1:
        condition: service_started
      coder-2:
        condition: service_started
      coder-3:
        condition: service_started
      coder-4:
        condition: service_started
      tester:
        condition: service_started
      deployer:
        condition: service_started
    privileged: true
    restart: unless-stopped
    hostname: nginx
    container_name: nginx
    stop_grace_period: 1s
    stop_signal: SIGTERM
    image: nginx:alpine
    ports:
      - 80:80/tcp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
