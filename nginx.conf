map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /index.html =404;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_buffering off;

  location = /coordinator {
    return 308 /coordinator/;
  }
  location /coordinator/ {
    proxy_pass http://coordinator:7681;
  }

  location = /coder-1 {
    return 308 /coder-1/;
  }
  location /coder-1/ {
    proxy_pass http://coder-1:7681;
  }

  location = /coder-2 {
    return 308 /coder-2/;
  }
  location /coder-2/ {
    proxy_pass http://coder-2:7681;
  }

  location = /coder-3 {
    return 308 /coder-3/;
  }
  location /coder-3/ {
    proxy_pass http://coder-3:7681;
  }

  location = /coder-4 {
    return 308 /coder-4/;
  }
  location /coder-4/ {
    proxy_pass http://coder-4:7681;
  }

  location = /tester {
    return 308 /tester/;
  }
  location /tester/ {
    proxy_pass http://tester:7681;
  }

  location = /deployer {
    return 308 /deployer/;
  }
  location /deployer/ {
    proxy_pass http://deployer:7681;
  }
}
