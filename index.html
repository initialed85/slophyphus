<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>slophyphus</title>
    <style>
      ::-webkit-scrollbar {
        display: none;
      } /* Chrome, Safari, Edge */
      * {
        scrollbar-width: none;
      } /* Firefox */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ccc;
        font: 12px monospace;
      }
      #wrap {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        grid-template-areas:
          "coordinator coder1"
          "coordinator coder2"
          "tester coder3"
          "deployer coder4";
        height: 100vh;
      }
      iframe,
      .placeholder {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        border: 1px solid #333;
        box-sizing: border-box;
      }
      #coordinator { grid-area: coordinator; }
      #tester { grid-area: tester; }
      #deployer { grid-area: deployer; }
      #coder1 { grid-area: coder1; }
      #coder2 { grid-area: coder2; }
      #coder3 { grid-area: coder3; }
      #coder4 { grid-area: coder4; }
      .placeholder {
        display: grid;
        place-items: center;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <iframe id="coordinator" src="/coordinator/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
      <iframe id="tester" src="/tester/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
      <iframe id="deployer" src="/deployer/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
      <iframe id="coder1" src="/coder-1/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
      <iframe id="coder2" src="/coder-2/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
      <iframe id="coder3" src="/coder-3/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
      <iframe id="coder4" src="/coder-4/" frameborder="0" scrolling="no" style="overflow: hidden"></iframe>
    </div>
  </body>
</html>
